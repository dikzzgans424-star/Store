<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Panel - Live Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { neon: '#00D4FF', dark: '#0A0A0A', gold: '#FFD700' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="config.js"></script>
</head>
<body class="bg-[#0A0A0A] text-white min-h-screen flex items-center justify-center p-4">

    <div id="login-section" class="w-full max-w-md bg-zinc-900/80 border border-zinc-800 p-8 rounded-2xl">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-black text-neon">Client Portal</h2>
            <p class="text-gray-400 text-xs mt-1">Ganti panel tinggal ganti isi config.js</p>
        </div>
        <div class="space-y-4">
            <input type="number" id="input-wa" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 text-sm" placeholder="Nomor WA (Cth: 6285810287828)">
            <input type="text" id="input-sn" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 text-sm" placeholder="Serial Number (SN) *Owner boleh kosong">
            <button onclick="prosesLogin()" id="btn-login" class="w-full bg-neon text-black font-bold py-3 rounded-xl text-sm">Verifikasi Masuk</button>
            <p id="pesan-notif" class="text-center text-xs font-bold text-neon h-4"></p>
        </div>
    </div>

    <div id="dashboard-section" class="w-full max-w-xl bg-zinc-900/80 border border-zinc-800 rounded-2xl hidden overflow-hidden">
        <div class="border-b border-zinc-800 p-5 flex justify-between items-center">
            <div>
                <h3 class="font-black text-lg text-white" id="view-name">-</h3>
                <p class="text-xs text-zinc-400 font-mono" id="view-wa">-</p>
            </div>
            <button onclick="logout()" class="bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold">Keluar</button>
        </div>

        <div class="p-6 space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-black/50 p-4 rounded-xl border border-zinc-800"><p class="text-[10px] uppercase font-bold text-zinc-500 mb-1">Dompet</p><h4 class="text-xl font-black text-white" id="view-uang">Rp 0</h4></div>
                <div class="bg-black/50 p-4 rounded-xl border border-zinc-800"><p class="text-[10px] uppercase font-bold text-zinc-500 mb-1">Bank</p><h4 class="text-xl font-black text-white" id="view-bank">Rp 0</h4></div>
                <div class="bg-black/50 p-4 rounded-xl border border-zinc-800"><p class="text-[10px] uppercase font-bold text-zinc-500 mb-1">Limit</p><h4 class="text-xl font-black text-neon" id="view-limit">0</h4></div>
                <div class="bg-black/50 p-4 rounded-xl border border-zinc-800"><p class="text-[10px] uppercase font-bold text-zinc-500 mb-1">Tag Status</p><h4 class="text-xl font-bold text-emerald-400 truncate" id="view-tag">-</h4></div>
            </div>

            <div id="owner-panel" class="hidden border border-neon/30 bg-neon/5 p-4 rounded-xl space-y-3">
                <h4 class="text-xs font-black text-neon uppercase tracking-wider"><i class="fas fa-user-gear mr-1"></i> Live Database Management</h4>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="edit-target" class="bg-black border border-zinc-700 rounded-lg px-3 py-2 text-xs" placeholder="WA Target (Cth: 6285773797508)">
                    <select id="edit-action" class="bg-black border border-zinc-700 rounded-lg px-3 py-2 text-xs text-white">
                        <option value="add_uang">Tambah Uang Dompet (+)</option>
                        <option value="set_uang">Ubah Total Uang (=)</option>
                        <option value="add_limit">Tambah Limit Bot (+)</option>
                        <option value="set_limit">Ubah Total Limit (=)</option>
                        <option value="set_vip">Ubah Status VIP (true/false)</option>
                        <option value="set_banned">Ubah Status Banned (true/false)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3 items-center">
                    <input type="text" id="edit-val" class="bg-black border border-zinc-700 rounded-lg px-3 py-2 text-xs" placeholder="Jumlah / Teks Value">
                    <button onclick="eksekusiEdit()" id="btn-edit" class="bg-neon text-black text-xs font-black py-2 rounded-lg">Kirim Perintah</button>
                </div>
                <p id="edit-notif" class="text-xs text-center font-bold h-4"></p>
            </div>
        </div>
    </div>

    <script>
        async function prosesLogin() {
            const wa = document.getElementById('input-wa').value.trim();
            const sn = document.getElementById('input-sn').value.trim();
            const notif = document.getElementById('pesan-notif');
            if(!wa) return alert("Isi nomor WA!");

            notif.innerText = "Connecting to Bot WebAPI...";
            
            try {
                const res = await fetch(`${CONFIG.PANEL_URL}/api/get-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nomorWA: wa, secret: CONFIG.SECRET_KEY })
                });
                const hasil = await res.json();
                
                if(!hasil.status) throw new Error(hasil.msg);

                // Validasi SN untuk member biasa
                if(!hasil.isOwner) {
                    if(!sn) throw new Error("Serial Number (SN) wajib diisi!");
                    if(hasil.profile.sn !== sn) throw new Error("Serial Number (SN) Salah!");
                }

                // Masuk ke Dashboard & Isi Data
                document.getElementById('view-name').innerText = hasil.profile.name;
                document.getElementById('view-wa').innerText = `+${wa}`;
                document.getElementById('view-uang').innerText = `Rp ${Number(hasil.profile.uang).toLocaleString('id-ID')}`;
                document.getElementById('view-bank').innerText = `Rp ${Number(hasil.profile.bank).toLocaleString('id-ID')}`;
                document.getElementById('view-limit').innerText = hasil.profile.limit;
                document.getElementById('view-tag').innerText = hasil.profile.tag;

                if(hasil.isOwner) document.getElementById('owner-panel').classList.remove('hidden');

                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                notif.innerText = "";
            } catch (err) {
                notif.innerText = err.message;
            }
        }

        async function eksekusiEdit() {
            const target = document.getElementById('edit-target').value.trim();
            const action = document.getElementById('edit-action').value;
            const val = document.getElementById('edit-val').value.trim();
            const eNotif = document.getElementById('edit-notif');

            if(!target || !val) return alert("Isi nomor target dan nilainya!");
            eNotif.innerText = "Processing...";

            try {
                const res = await fetch(`${CONFIG.PANEL_URL}/api/update-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ targetNumber: target, actionType: action, amount: val, secret: CONFIG.SECRET_KEY })
                });
                const hasil = await res.json();
                eNotif.innerText = hasil.msg;
                eNotif.className = hasil.status ? "text-xs text-center font-bold text-green-400" : "text-xs text-center font-bold text-red-500";
            } catch (err) {
                eNotif.innerText = err.message;
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
